name: Build Galaxy Tab Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout NoteFlow Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin) for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Run Verification Gate
        run: |
          npm ci
          npm run verify:gate
          npm run build

      - name: Generate Capacitor Android Project & Assemble Debug APK
        run: |
          npm install --no-save @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Galaxy Tab S-Pen Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noteflow-galaxy-tab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
