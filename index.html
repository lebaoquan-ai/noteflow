<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>NoteFlow — Stylus-First AI Spatial Zettelkasten</title>
    <style>
      :root {
        --bg-paper: #ffffff;
        --glass-bg: rgba(255, 255, 255, 0.88);
        --glass-border: rgba(226, 232, 240, 0.9);
        --text-main: #1e293b;
        --text-muted: #64748b;
        --violet-accent: #7c3aed;
        --violet-soft: #f5f3ff;
        --cobalt-accent: #1d4ed8;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--bg-paper);
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui,
          sans-serif;
        color: var(--text-main);
        touch-action: none;
      }

      .nf-viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }

      .nf-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .nf-dry-canvas {
        z-index: 1;
      }

      .nf-wet-canvas {
        z-index: 2;
        cursor: crosshair;
      }

      .nf-top-bar {
        position: absolute;
        top: 12px;
        left: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 14px;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
        pointer-events: auto;
        flex-wrap: wrap;
      }

      .nf-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .nf-brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--violet-accent);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
      }

      .nf-badge-pill {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--violet-soft);
        color: var(--violet-accent);
        border: 1px solid rgba(124, 58, 237, 0.25);
      }

      .nf-telemetry {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--text-muted);
      }

      .nf-layer-bar,
      .nf-history-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .nf-chip,
      .nf-btn {
        appearance: none;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.12s ease;
      }

      .nf-chip-active {
        background: #eff6ff;
        color: var(--cobalt-accent);
        border-color: #93c5fd;
      }

      .nf-chip-teaching {
        background: #f8fafc;
        color: #334155;
      }

      .nf-chip-teaching-on {
        background: #15803d;
        color: #ffffff;
        border-color: #15803d;
      }

      .nf-tool-dock {
        position: absolute;
        left: 16px;
        top: 76px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        width: 122px;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      .nf-action-dock {
        position: absolute;
        right: 16px;
        top: 76px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        width: 146px;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      .nf-dock-section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin: 2px 4px;
      }

      .nf-dock-divider {
        height: 1px;
        background: #e2e8f0;
        margin: 4px 0;
      }

      .nf-tool-btn,
      .nf-action-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 7px 9px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-main);
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 9px;
        cursor: pointer;
        text-align: left;
      }

      .nf-tool-active {
        background: #1e293b;
        color: #ffffff;
        border-color: #1e293b;
      }

      .nf-tool-violet.nf-tool-active {
        background: var(--violet-accent);
        border-color: var(--violet-accent);
      }

      .nf-color-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 2px;
      }

      .nf-swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        margin: 0 auto;
      }

      .nf-swatch-active {
        transform: scale(1.15);
        box-shadow:
          0 0 0 2px #ffffff,
          0 0 0 4px #1e293b;
      }

      .nf-width-row {
        display: flex;
        gap: 4px;
      }

      .nf-width-btn {
        flex: 1;
        font-size: 11px;
        font-weight: 600;
        padding: 5px 2px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        cursor: pointer;
      }

      .nf-width-active {
        background: #1e293b;
        color: #ffffff;
        border-color: #1e293b;
      }

      .nf-footer-hint {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        font-size: 11px;
        color: var(--text-muted);
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 999px;
        white-space: nowrap;
        pointer-events: none;
      }

      /* Floating 6-Slot Radial Tool Wheel */
      .nf-radial-wheel {
        position: absolute;
        width: 180px;
        height: 180px;
        margin-left: -90px;
        margin-top: -90px;
        z-index: 20;
        display: none;
        pointer-events: auto;
      }

      .nf-radial-wheel-visible {
        display: block;
      }

      .nf-radial-center {
        position: absolute;
        left: 90px;
        top: 90px;
        width: 54px;
        height: 54px;
        margin-left: -27px;
        margin-top: -27px;
        border-radius: 50%;
        background: #1e293b;
        color: #ffffff;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.28);
        border: 2.5px solid #1e293b;
        cursor: grab;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        transition: transform 0.1s ease, border-color 0.15s ease;
      }

      .nf-radial-center:active {
        cursor: grabbing;
        transform: scale(0.96);
      }

      .nf-radial-center-icon {
        font-size: 16px;
        line-height: 1.1;
      }

      .nf-radial-center-label {
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.05em;
        opacity: 0.9;
      }

      .nf-radial-slice {
        position: absolute;
        width: 52px;
        height: 52px;
        margin-left: -26px;
        margin-top: -26px;
        border-radius: 50%;
        border: 1px solid var(--glass-border);
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--text-main);
        font-size: 10px;
        font-weight: 700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.14);
        transition: transform 0.12s ease, background 0.12s ease;
      }

      .nf-radial-slice:active {
        transform: scale(1.05);
      }

      .nf-radial-slice.nf-tool-active {
        background: #1e293b;
        color: #ffffff;
        border-color: #1e293b;
        transform: scale(1.1);
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);
      }

      /* Settings Floating Button & Slide-Over Drawer */
      .nf-settings-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
        z-index: 25;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .nf-settings-btn:hover,
      .nf-settings-btn:active {
        transform: scale(1.08);
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16);
      }

      .nf-settings-backdrop {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.2);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        z-index: 30;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      .nf-settings-backdrop-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .nf-settings-drawer {
        position: absolute;
        top: 0;
        right: 0;
        width: 360px;
        max-width: 90vw;
        height: 100%;
        background: #ffffff;
        box-shadow: -8px 0 24px rgba(15, 23, 42, 0.15);
        z-index: 35;
        transform: translateX(100%);
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: 20px;
        gap: 16px;
      }

      .nf-settings-drawer-open {
        transform: translateX(0);
      }

      .nf-settings-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--glass-border);
      }

      .nf-settings-title-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .nf-settings-title {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        color: var(--text-main);
      }

      .nf-settings-close-btn {
        font-size: 16px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid var(--glass-border);
        background: #f8fafc;
        cursor: pointer;
      }

      .nf-settings-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .nf-settings-section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-top: 2px;
      }

      .nf-settings-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .nf-settings-tools-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .nf-settings-card {
        background: #f8fafc;
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .nf-settings-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-muted);
      }

      .nf-gestures-list {
        margin: 0;
        padding-left: 18px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--text-main);
      }

      .nf-gestures-list li {
        margin-bottom: 4px;
      }

      /* AI Status Badge Inspection Popover */
      .nf-badge-popover {
        position: absolute;
        width: 268px;
        z-index: 25;
        display: none;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        background: var(--glass-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
        pointer-events: auto;
      }

      .nf-badge-popover-visible {
        display: flex;
      }

      .nf-badge-popover-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .nf-badge-popover-message {
        font-size: 12px;
        line-height: 1.4;
        color: var(--text-main);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/tablet_app.ts"></script>
  </body>
</html>
